<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Tells the browser to paint its canvas dark *before* any CSS is parsed.
         Without it the first frame is the UA default white, whatever we do. -->
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Move files between two devices with no server, no internet and no accounts — over sound, light, paper, vibration or radio."
    />
    <title>DEAD DROP</title>

    <!-- Critical, inline, and deliberately duplicated from style.css.
         The real stylesheet arrives through the module graph (a JS-injected
         <style> in dev, a hashed <link> in prod), so it is not in effect on the
         first paint. These few rules are: black ground, a full-bleed boot
         overlay, and the app hidden until it has been laid out. Everything else
         can wait; a flash of unstyled terminal cannot.

         The boot title starts invisible and is revealed by JS once the pixel
         font has actually loaded — a fallback would render it at a wildly
         different width and shift the layout on its way out. -->
    <style>
      html {
        background: #000;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #000;
        color: #ece7da;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot .boot-title {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }
      body.fonts-ready #boot .boot-title {
        opacity: 1;
      }
      body.booting #app {
        visibility: hidden;
      }
      /* Failsafe: a black overlay is the right first paint, but it is the wrong
         thing to be left staring at if the module never boots. */
      body.boot-stalled #boot::after {
        content: "> BOOT FAILED. RELOAD, OR CHECK THAT SCRIPTS ARE ALLOWED.";
        position: absolute;
        bottom: 18%;
        left: 0;
        right: 0;
        text-align: center;
        padding: 0 16px;
        color: #ff6a2b;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
    <script>
      // Classic script, runs immediately: the module graph may never execute.
      setTimeout(function () {
        if (document.body && document.body.classList.contains("booting")) {
          document.body.classList.add("boot-stalled", "fonts-ready");
        }
      }, 8000);
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pixel font blocks: a fallback would reflow the title. Mono swaps. -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="booting">
    <div id="boot"><div class="boot-title">DEAD DROP</div></div>
    <div id="app"></div>
    <noscript>
      <style>
        #boot {
          display: none !important;
        }
      </style>
      <p style="color: #ffb000; font: 13px ui-monospace, monospace; padding: 24px; line-height: 1.6">
        &gt; JAVASCRIPT REQUIRED.<br />
        &gt; THIS RUNS ENTIRELY IN THE BROWSER. THERE IS NO SERVER TO FALL BACK TO.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
